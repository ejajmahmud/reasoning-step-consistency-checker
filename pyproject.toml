[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-step-consistency-checker"
version = "0.1.0"
description = "Cross-checks claimed numbers and symbols in agent final summaries against recorded tool-response payloads"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
reasoning-step-consistency-checker = "reasoning_step_consistency_checker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reasoning_step_consistency_checker*"]
